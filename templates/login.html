<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Control de Gestión RICOH & Banco de Chile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --bch-blue: #002a61; --ricoh-red: #e81c24; }
        body { background: linear-gradient(135deg, var(--bch-blue) 0%, #061833 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; border-radius: 12px; border-top: 5px solid var(--ricoh-red); }
        .btn-ricoh { background-color: var(--ricoh-red); color: white; font-weight: 600; }
        .btn-ricoh:hover { background-color: #b51218; color: white; }
    </style>
</head>
<body>
    <div class="card login-card shadow-lg p-4 bg-white">
        <div class="text-center mb-4">
            <h3 class="fw-bold mb-0"><span style="color: var(--ricoh-red);">RICOH</span> | <span style="color: var(--bch-blue);">Banco de Chile</span></h3>
            <small class="text-muted">Control de Gestión — Grupo Soporte Apple</small>
        </div>
        {% if error %}
        <div class="alert alert-danger py-2 small text-center">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold">Usuario</label>
                <input type="text" name="username" class="form-control" value="admin" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Contraseña</label>
                <input type="password" name="password" class="form-control" value="Admin2026!" required>
            </div>
            <button type="submit" class="btn btn-ricoh w-100 py-2">Ingresar al Panel</button>
        </form>
        <div class="text-center mt-3">
            <small class="text-muted">Credenciales prueba: <code>admin</code> / <code>Admin2026!</code></small>
        </div>
    </div>
</body>
</html>
